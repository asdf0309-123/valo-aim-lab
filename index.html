<!doctype html>
<html lang="ko" class="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PROTOCOL // AIM LAB</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>tailwind.config={theme:{extend:{colors:{champ:'#f5c542',cyan:'#00f5d4',red:'#ff4655'}}}}</script>
<style>
:root{--ink:#0f1923;--ink2:#15232f;--paper:#ece8e1;--paper2:#d9d5cf;--red:#ff4655;--red2:#d83648;--cyan:#59e1e6;--line:rgba(236,232,225,.18)}
*{box-sizing:border-box;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--ink);color:var(--paper);font-family:Arial,"Noto Sans KR",sans-serif;letter-spacing:.02em}body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:999;background:repeating-linear-gradient(90deg,transparent 0 79px,rgba(255,255,255,.025) 80px),repeating-linear-gradient(0deg,transparent 0 79px,rgba(255,255,255,.018) 80px);mix-blend-mode:screen}
button,input{font:inherit}button{position:relative;border:0;cursor:pointer;text-transform:uppercase;letter-spacing:.08em;transition:.18s ease;overflow:hidden}button:before{content:"";position:absolute;inset:0;background:var(--red);transform:translateX(-102%);transition:.22s ease;z-index:-1}button:hover:before{transform:translateX(0)}button:hover{color:white!important;transform:translate(-2px,-2px);box-shadow:4px 4px 0 rgba(0,0,0,.35)}
.card{background:linear-gradient(135deg,rgba(21,35,47,.96),rgba(15,25,35,.94));border:1px solid var(--line);border-radius:0;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));box-shadow:0 18px 50px rgba(0,0,0,.3);backdrop-filter:blur(12px)}.modal{background:rgba(8,15,22,.87);backdrop-filter:blur(10px)}
#mainMenuScreen{background:radial-gradient(circle at 75% 45%,rgba(255,70,85,.16),transparent 30%),linear-gradient(115deg,var(--paper) 0 54%,var(--ink) 54% 100%)!important;color:var(--ink);align-items:flex-start!important;padding-left:8vw!important}#mainMenuScreen:after{content:"AIM / 01";position:absolute;right:-30px;bottom:6vh;color:transparent;-webkit-text-stroke:1px rgba(236,232,225,.22);font-size:clamp(80px,15vw,220px);font-weight:900;letter-spacing:-.08em;transform:rotate(-90deg)}#mainMenuScreen>div:first-child{top:34px;left:8vw;border-left:8px solid var(--red);padding-left:12px;letter-spacing:.18em}#mainMenuScreen>div:nth-child(2){text-align:left!important;max-width:760px!important;position:relative;z-index:2}#mainMenuScreen h1{font-size:clamp(44px,6vw,88px)!important;line-height:.91;letter-spacing:-.06em;text-transform:uppercase;margin-bottom:28px!important}#mainMenuScreen h1 span{color:var(--red)!important}#mainMenuScreen p{color:#48535d!important;max-width:580px;border-left:2px solid var(--red);padding-left:16px}#mainMenuScreen .inline-block{color:var(--red)!important;border:1px solid rgba(15,25,35,.2)!important;background:transparent!important;border-radius:0!important;letter-spacing:.18em}#mainMenuScreen .flex{justify-content:flex-start!important}#mainMenuScreen button{border-radius:0!important;padding:16px 28px!important;border:1px solid var(--ink)!important;background:transparent!important;color:var(--ink)!important;font-weight:900}#btnLobbyStartGame{background:var(--red)!important;color:white!important;border-color:var(--red)!important}#btnLobbyStartGame:hover{background:var(--ink)!important}
#viewportContainer:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,70,85,.08),transparent 12%,transparent 88%,rgba(89,225,230,.05)),linear-gradient(0deg,rgba(15,25,35,.18),transparent 25%)}#viewportContainer>.card,#viewportContainer>div>.card{border-top:2px solid var(--red)}#hudTimer{color:white;font-size:18px}#hudKills,#hudScore{color:var(--red)!important}#hudHsRate{color:var(--cyan)!important}#mouseLockHint{border-left:4px solid var(--red);font-weight:700;letter-spacing:.06em}#hudVelocityBar{border-radius:0!important}.bg-green-400{background:var(--cyan)!important}.bg-red{background:var(--red)!important}.text-green-400{color:var(--cyan)!important}.text-champ{color:var(--red)!important}.text-cyan{color:var(--cyan)!important}.bg-champ{background:var(--red)!important}.bg-cyan{background:var(--cyan)!important}
#settingsModal .card,#crosshairModal .card,#resultModal .card,#escPauseMenu .card{border-top:4px solid var(--red);padding:28px!important}#settingsModal h2,#crosshairModal h2,#resultModal h2,#escPauseMenu h2{text-transform:uppercase;letter-spacing:.1em}#settingsModal button,#crosshairModal button,#resultModal button,#escPauseMenu button{border-radius:0!important;border:1px solid rgba(236,232,225,.24);background:transparent;color:var(--paper);font-weight:800;z-index:1}#settingsModal .bg-white,#crosshairModal .bg-white,#resultModal .bg-white,#escPauseMenu .bg-white{background:var(--paper)!important;color:var(--ink)!important}input[type=range]{appearance:none;height:4px;background:#46525c;outline:0}input[type=range]::-webkit-slider-thumb{appearance:none;width:16px;height:16px;background:var(--red);transform:rotate(45deg)}input[type=color]{border:0;background:transparent}.speed-btn{min-height:42px}.speed-btn.bg-white{background:var(--red)!important;color:white!important}.rounded,.rounded-xl,.rounded-full{border-radius:0!important}
@media(max-width:700px){#mainMenuScreen{padding-left:24px!important;padding-right:24px!important;background:linear-gradient(150deg,var(--paper) 0 68%,var(--ink) 68%)!important}#mainMenuScreen .flex{width:100%}#mainMenuScreen button{width:100%}#mainMenuScreen:after{display:none}}
</style>
</head>
<body class="h-screen w-screen">
<div id="mainMenuScreen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#0b0f15] p-6 transition-opacity">
  <div class="absolute top-6 left-8 font-black text-xl">PROTOCOL<span class="text-champ">//</span>AIM</div>
  <div class="text-center max-w-3xl">
    <div class="inline-block mb-4 px-3 py-1 rounded-full bg-white/5 border border-white/10 text-xs text-champ">어센트 A 사이트 · 에임 트레이닝</div>
    <h1 class="text-4xl sm:text-6xl font-black mb-4">DEFY YOUR LIMITS<br><span class="text-champ">WIDE PEEK TRAINING</span></h1>
    <p class="text-gray-400 mb-8">WASD 이동, 마우스 조준, 좌클릭 사격. ESC로 일시정지합니다.</p>
    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <button id="btnLobbyStartGame" class="px-9 py-4 rounded-xl bg-white text-black font-black"><i class="fa fa-play text-red mr-2"></i>훈련 시작</button>
      <button id="btnLobbyOpenSettings" class="px-7 py-4 card font-bold">감도 설정</button>
      <button id="btnLobbyOpenCrosshair" class="px-7 py-4 card font-bold">조준선 설정</button>
    </div>
  </div>
</div>
<main id="viewportContainer" class="relative w-screen h-screen bg-[#090e14]">
  <canvas id="webglCanvas" class="block w-full h-full"></canvas><canvas id="hudCanvas" class="absolute inset-0 pointer-events-none"></canvas>
  <div class="absolute top-4 left-1/2 -translate-x-1/2 z-20 card px-5 py-2 flex gap-4 font-mono"><span>처치 <b id="hudKills" class="text-champ">0</b></span><b id="hudTimer">60.0</b><span>HS <b id="hudHsRate" class="text-cyan">0%</b></span></div>
  <div class="absolute top-4 right-4 z-20 card px-4 py-2 text-right"><small class="text-gray-400">SCORE</small><div id="hudScore" class="text-xl font-black text-champ">0</div></div>
  <div id="mouseLockHint" class="absolute top-4 left-4 z-20 card px-3 py-2 text-xs">화면 클릭: 마우스 고정 · ESC: 메뉴</div>
  <div class="absolute bottom-14 left-1/2 -translate-x-1/2 z-20 text-center"><div id="hudStrafeBadge" class="text-xs text-green-400">완전 정지 (정확도 100%)</div><div class="w-32 h-2 mt-1 bg-black rounded"><div id="hudVelocityBar" class="h-full bg-green-400 rounded" style="width:0"></div></div></div>
  <div class="absolute bottom-4 right-5 z-20 card px-4 py-2"><span class="text-champ font-bold">VANDAL</span> <b id="hudAmmoMag" class="text-2xl ml-3">25</b> / ∞</div>
  <div id="escPauseMenu" class="absolute inset-0 z-[100] modal hidden items-center justify-center p-4"><div class="card w-full max-w-sm p-6 text-center space-y-3"><h2 class="text-2xl font-black mb-4">일시정지</h2><button id="btnResumeGame" class="w-full py-3 bg-white text-black rounded-xl font-black">계속하기</button><button id="btnPauseOpenSettingsModal" class="w-full py-3 bg-white/10 rounded-xl">감도 설정</button><button id="btnPauseOpenCrosshair" class="w-full py-3 bg-white/10 rounded-xl">조준선 설정</button><button id="btnResetSessionStats" class="w-full py-3 bg-white/10 rounded-xl">라운드 재시작</button><button id="btnReturnToMainMenu" class="w-full py-3 border border-white/20 rounded-xl">메인 화면</button></div></div>
</main>
<div id="settingsModal" class="fixed inset-0 z-[110] modal hidden items-center justify-center p-4"><div class="card w-full max-w-lg p-6"><div class="flex justify-between mb-5"><h2 class="font-black text-xl">환경 설정</h2><button id="btnCloseSettingsModal">✕</button></div><label class="flex justify-between mb-2">감도 <input id="inputSensitivity" type="number" min="0.01" max="3" step="0.001" value="0.24" class="bg-black/30 rounded px-2 w-24 text-right"></label><input id="sliderSensitivity" type="range" min="0.05" max="1.5" step="0.005" value="0.24" class="w-full"><div class="mt-5"><div class="mb-2">봇 속도</div><div id="botSpeedBtns" class="grid grid-cols-3 gap-2"><button data-speed="0.75" class="speed-btn py-2 bg-white/10 rounded">느림</button><button data-speed="1" class="speed-btn py-2 bg-white text-black rounded">표준</button><button data-speed="1.35" class="speed-btn py-2 bg-white/10 rounded">빠름</button></div></div><button id="btnSaveAndCloseSettings" class="w-full mt-6 py-3 bg-champ text-black font-black rounded-xl">저장 및 닫기</button></div></div>
<div id="crosshairModal" class="fixed inset-0 z-[110] modal hidden items-center justify-center p-4"><div class="card w-full max-w-md p-6"><div class="flex justify-between mb-5"><h2 class="font-black text-xl">조준선 설정</h2><button id="btnCloseCrosshair">✕</button></div><label class="block mb-3">색상 <input id="crosshairColor" type="color" value="#ffffff" class="ml-3"></label><label class="block mb-3">길이 <input id="crosshairLength" type="range" min="1" max="12" value="4" class="w-2/3 ml-3"></label><label><input id="crosshairDot" type="checkbox" checked> 중앙점 표시</label><button id="btnSaveCrosshair" class="w-full mt-6 py-3 bg-cyan text-black font-black rounded-xl">저장 및 닫기</button></div></div>
<div id="resultModal" class="fixed inset-0 z-[120] modal hidden items-center justify-center p-4"><div class="card w-full max-w-sm p-6 text-center"><div class="text-champ text-xs">SESSION COMPLETED</div><h2 class="text-2xl font-black my-4">훈련 결과</h2><div class="grid grid-cols-2 gap-3 mb-5"><div class="bg-black/30 rounded-xl p-3">점수<div id="resScore" class="text-2xl text-champ font-black">0</div></div><div class="bg-black/30 rounded-xl p-3">HS%<div id="resHsRate" class="text-2xl text-cyan font-black">0%</div></div></div><button id="btnResultPlayAgain" class="w-full py-3 bg-white text-black font-black rounded-xl">다시 시작</button></div></div>
<script>
const $=id=>document.getElementById(id), state={screen:'lobby',playing:false,locked:false,sensitivity:.24,botSpeed:1,score:0,kills:0,hs:0,shots:0,time:60,keys:{},vel:new THREE.Vector3(),pos:new THREE.Vector3(0,0,-1.6),yaw:0,pitch:0,lastShot:0};
const canvas=$('webglCanvas'),hud=$('hudCanvas'),ctx=hud.getContext('2d'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));const scene=new THREE.Scene();scene.background=new THREE.Color(0xbfaea4);scene.fog=new THREE.FogExp2(0xbfaea4,.012);const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,100);camera.rotation.order='YXZ';scene.add(camera);scene.add(new THREE.HemisphereLight(0xfff2ea,0x443833,1.2));const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,45),new THREE.MeshStandardMaterial({color:0x615854}));ground.rotation.x=-Math.PI/2;scene.add(ground);const wallMat=new THREE.MeshStandardMaterial({color:0xc8b8aa});[[-5.3,4.2,-5],[5.3,4.2,-5]].forEach(p=>{const m=new THREE.Mesh(new THREE.BoxGeometry(8,8,.8),wallMat);m.position.set(...p);scene.add(m)});const back=new THREE.Mesh(new THREE.BoxGeometry(16,7,.6),new THREE.MeshStandardMaterial({color:0x9e9086}));back.position.set(0,3.5,-14.5);scene.add(back);
const weapon=new THREE.Group();camera.add(weapon);const gun=new THREE.Mesh(new THREE.BoxGeometry(.08,.1,.55),new THREE.MeshStandardMaterial({color:0x17191d,metalness:.7}));weapon.add(gun);weapon.position.set(.27,-.25,-.45);let bot=null;function spawnBot(){if(bot)return;const g=new THREE.Group(),head=new THREE.Mesh(new THREE.SphereGeometry(.22,16,16),new THREE.MeshStandardMaterial({color:0xffe600})),body=new THREE.Mesh(new THREE.BoxGeometry(.55,.7,.3),new THREE.MeshStandardMaterial({color:0x303744}));head.position.y=1.58;body.position.y=1.05;g.add(head,body);const dir=Math.random()<.5?1:-1;g.position.set(dir<0?3:-3,0,-13);head.userData={part:'head'};body.userData={part:'body'};bot={g,head,body,dir,hp:150};scene.add(g)}function removeBot(){if(bot)scene.remove(bot.g);bot=null}
const ray=new THREE.Raycaster();function shoot(){if(!state.playing||performance.now()-state.lastShot<105)return;state.lastShot=performance.now();state.shots++;$('hudAmmoMag').textContent=24-(state.shots%25);const spread=state.vel.length()>.1?(Math.random()-.5)*.08:0;ray.setFromCamera(new THREE.Vector2(spread,spread),camera);if(bot){const hit=ray.intersectObjects([bot.head,bot.body],false)[0];if(hit){const head=hit.object.userData.part==='head';bot.hp-=head?160:40;if(bot.hp<=0){state.kills++;if(head)state.hs++;state.score+=head?300:100;removeBot();updateHud();setTimeout(spawnBot,400)}}}}
function updateHud(){ $('hudKills').textContent=state.kills;$('hudScore').textContent=state.score;const hs=state.kills?Math.round(state.hs/state.kills*100):0;$('hudHsRate').textContent=hs+'%'}
function modal(id,show){$(id).classList.toggle('hidden',!show);$(id).classList.toggle('flex',show)}function lock(){if(state.playing) $('viewportContainer').requestPointerLock?.()}
function start(){removeBot();Object.assign(state,{screen:'playing',playing:true,score:0,kills:0,hs:0,shots:0,time:60});state.pos.set(0,0,-1.6);state.vel.set(0,0,0);$('mainMenuScreen').classList.add('opacity-0','pointer-events-none');modal('escPauseMenu',false);modal('resultModal',false);updateHud();spawnBot();setTimeout(lock,100)}function pause(){state.playing=false;document.exitPointerLock?.();modal('escPauseMenu',true)}function resume(){modal('escPauseMenu',false);state.playing=true;lock()}function lobby(){state.playing=false;state.screen='lobby';removeBot();document.exitPointerLock?.();modal('escPauseMenu',false);$('mainMenuScreen').classList.remove('opacity-0','pointer-events-none')}
$('btnLobbyStartGame').onclick=start;$('btnResumeGame').onclick=resume;$('btnResetSessionStats').onclick=start;$('btnReturnToMainMenu').onclick=lobby;$('btnResultPlayAgain').onclick=start;function openSettings(){state.playing=false;document.exitPointerLock?.();modal('settingsModal',true)}$('btnLobbyOpenSettings').onclick=openSettings;$('btnPauseOpenSettingsModal').onclick=()=>{modal('escPauseMenu',false);openSettings()};$('btnCloseSettingsModal').onclick=()=>modal('settingsModal',false);$('btnSaveAndCloseSettings').onclick=()=>modal('settingsModal',false);function openCross(){state.playing=false;document.exitPointerLock?.();modal('crosshairModal',true)}$('btnLobbyOpenCrosshair').onclick=openCross;$('btnPauseOpenCrosshair').onclick=()=>{modal('escPauseMenu',false);openCross()};$('btnCloseCrosshair').onclick=()=>modal('crosshairModal',false);$('btnSaveCrosshair').onclick=()=>modal('crosshairModal',false);
$('sliderSensitivity').oninput=e=>{$('inputSensitivity').value=e.target.value;state.sensitivity=+e.target.value};$('inputSensitivity').oninput=e=>{const v=Math.max(.01,Math.min(3,+e.target.value||.24));state.sensitivity=v;$('sliderSensitivity').value=v};document.querySelectorAll('.speed-btn').forEach(b=>b.onclick=()=>{state.botSpeed=+b.dataset.speed;document.querySelectorAll('.speed-btn').forEach(x=>x.className='speed-btn py-2 bg-white/10 rounded');b.className='speed-btn py-2 bg-white text-black rounded'});
document.addEventListener('pointerlockchange',()=>{state.locked=document.pointerLockElement===$('viewportContainer');$('mouseLockHint').style.opacity=state.locked?'0':'1'});$('viewportContainer').addEventListener('mousedown',e=>{if(state.screen!=='playing'||!state.playing)return;if(!state.locked)return lock();if(e.button===0)shoot()});document.addEventListener('mousemove',e=>{if(!state.locked||!state.playing)return;const s=state.sensitivity*.00118;state.yaw-=e.movementX*s;state.pitch=Math.max(-1.4,Math.min(1.4,state.pitch-e.movementY*s))});addEventListener('keydown',e=>{if(e.code==='Escape'&&state.screen==='playing'){pause();return}state.keys[e.code]=true});addEventListener('keyup',e=>state.keys[e.code]=false);
let last=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;if(canvas.width!==innerWidth||canvas.height!==innerHeight){renderer.setSize(innerWidth,innerHeight,false);hud.width=innerWidth;hud.height=innerHeight;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}if(state.playing){state.time=Math.max(0,state.time-dt);$('hudTimer').textContent=state.time.toFixed(1);if(state.time<=0){state.playing=false;document.exitPointerLock?.();$('resScore').textContent=state.score;$('resHsRate').textContent=(state.kills?Math.round(state.hs/state.kills*100):0)+'%';modal('resultModal',true)}const x=(state.keys.KeyD?1:0)-(state.keys.KeyA?1:0),z=(state.keys.KeyS?1:0)-(state.keys.KeyW?1:0),acc=18;if(x||z){state.vel.x+=(x*acc*dt);state.vel.z+=(z*acc*dt);const len=state.vel.length();if(len>3.2)state.vel.multiplyScalar(3.2/len)}else state.vel.multiplyScalar(Math.max(0,1-14*dt));state.pos.addScaledVector(state.vel,dt);state.pos.x=Math.max(-1.55,Math.min(1.55,state.pos.x));state.pos.z=Math.max(-2.4,Math.min(-.7,state.pos.z));camera.position.set(state.pos.x,1.58,state.pos.z);camera.rotation.set(state.pitch,state.yaw,0);const pct=Math.min(100,state.vel.length()/3.2*100);$('hudVelocityBar').style.width=pct+'%';$('hudVelocityBar').className='h-full rounded '+(pct<3?'bg-green-400':'bg-red');$('hudStrafeBadge').textContent=pct<3?'완전 정지 (정확도 100%)':'이동 중 (탄퍼짐 발생)';if(bot){bot.g.position.x+=bot.dir*3.8*state.botSpeed*dt;if(Math.abs(bot.g.position.x)>3.6){state.score=0;removeBot();updateHud();setTimeout(spawnBot,400)}}}renderer.render(scene,camera);ctx.clearRect(0,0,hud.width,hud.height);const cx=hud.width/2,cy=hud.height/2,c=$('crosshairColor').value,l=+$('crosshairLength').value;ctx.fillStyle=c;if($('crosshairDot').checked)ctx.fillRect(cx-1,cy-1,2,2);ctx.fillRect(cx-10-l,cy-1,l,2);ctx.fillRect(cx+10,cy-1,l,2);ctx.fillRect(cx-1,cy-10-l,2,l);ctx.fillRect(cx-1,cy+10,2,l)}requestAnimationFrame(loop);
</script></body></html>
